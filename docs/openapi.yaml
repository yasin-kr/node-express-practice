openapi: 3.1.0
info:
  title: Students app
  version: 1.0.0
  description: Students API documentation
tags:
  - name: Students
    description: Operations about students.
  - name: Auth
    description: Authentication operations.
servers:
  - url: https://node-express-practice-ef0a.onrender.com

paths: 
  /students/{studentId}:
    get:
      $ref: ../swagger/paths/students/{studentId}/get.yaml
    put:
      $ref: ../swagger/paths/students/{studentId}/put.yaml
    patch:
      $ref: ../swagger/paths/students/{studentId}/patch.yaml
    delete:
      $ref: ../swagger/paths/students/{studentId}/delete.yaml
  /students:
    get:
      $ref: ../swagger/paths/students/get.yaml
    post:
      $ref: ../swagger/paths/students/post.yaml
  /auth/get-oauth-url:
    get:
      $ref: ../swagger/paths/auth/get-oauth-url.yaml
  /auth/confirm-oauth:
    post:
      $ref: ../swagger/paths/auth/confirm-oauth.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh.yaml
  /auth/request-reset-email:
    post:
      $ref: ../swagger/paths/auth/request-reset-email.yaml
  /auth/reset-password:
    post:
      $ref: ../swagger/paths/auth/reset-password.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
