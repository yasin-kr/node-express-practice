tags:
  - Students
summary: Create or update a student
operationId: upsertStudent
description: >
  Creates a student if the given ID does not exist.
  Updates the student if it does. Requires a teacher account.
parameters:
  - in: path
    name: studentId
    required: true
    schema:
      type: string
    description: The ID of the student to create or update.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - age
          - gender
          - avgMark
          - parentId
        properties:
          name:
            type: string
            example: John Doe
          age:
            type: integer
            example: 12
          gender:
            type: string
            enum:
              - male
              - female
              - other
            example: male
          avgMark:
            type: number
            example: 9.7
          onDuty:
            type: boolean
            example: false
          parentId:
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            type: string
            format: binary
            description: Optional student photo.
responses:
  '200':
    description: Existing student updated.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully upserted a student!
            data:
              $ref: ../../../components/schemas/student.yaml
  '201':
    description: Student created because the given ID did not exist.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully upserted a student!
            data:
              $ref: ../../../components/schemas/student.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '403':
    description: Only teachers can create or update students with this operation.
