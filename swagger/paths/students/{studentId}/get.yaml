tags:
  - Students
summary: Get student by ID
operationId: getStudentById
description: Find one student using the student's ID.

parameters:
  - in: path
    name: studentId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598375'

security:
  - bearerAuth: []

responses:
  '200':
    description: Student found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found a student!
            data:
              $ref: '../../../components/schemas/student.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '403':
    description: User does not have permission to access this student.
  '404':
    description: Student not found.
