tags:
  - Students
summary: Get list of students
operationId: getStudents
description: Retrieve the students list. Requires a teacher account.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    example: 1
    description: Page number to return.
  - in: query
    name: perPage
    schema:
      type: integer
    example: 10
    description: Number of students per page.
  - in: query
    name: sortBy
    schema:
      type: string
    example: age
    description: Student field to sort by. Defaults to _id.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum:
        - asc
        - desc
    example: asc
    description: Sort direction.
  - in: query
    name: minAvgMark
    schema:
      type: number
    example: 4
    description: Minimum average mark.
  - in: query
    name: maxAvgMark
    schema:
      type: number
    example: 10
    description: Maximum average mark.
  - in: query
    name: minAge
    schema:
      type: number
    example: 10
    description: Minimum age.
  - in: query
    name: maxAge
    schema:
      type: number
    example: 16
    description: Maximum age.
  - in: query
    name: gender
    schema:
      type: string
      enum:
        - male
        - female
        - other
    example: male
    description: Filter by gender.

responses:
  '200':
    description: Successfully found students!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found students!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/student.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '403':
    description: Only teachers can access the students list.
