tags:
  - Students
summary: Create student
operationId: createStudent
description: Create a student. Requires a teacher account.
security:
  - bearerAuth: []
  
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - age
          - gender
          - avgMark
          - parentId
        properties:
          name:
            type: string
            example: John Doe
          age:
            type: number
            example: 12
          gender:
            type: string
            enum:
              - male
              - female
              - other
          avgMark:
            type: number
            example: 9.7
          onDuty:
            type: boolean
            example: false
          parentId:
            type: string
            example: '65e4decdd286b30065d54af9'
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Student created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!
            data:
              $ref: '../../components/schemas/student.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '403':
    description: Only teachers can create students.
