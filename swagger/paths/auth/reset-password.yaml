tags:
  - Auth
summary: Reset a user's password
operationId: resetPassword
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            type: string
            format: password
            example: NewPassword123
          token:
            type: string
            example: password-reset-token
responses:
  '200':
    description: Password reset successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password was successfully reset!
            data:
              type: object
              example: {}
  '400':
    description: The password or reset token is missing or invalid.
